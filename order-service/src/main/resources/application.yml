server:
  port: 8080

spring:
  application:
    name: order-service

  threads:
    virtual:
      enabled: true   # Java 21 virtual threads - blocking-style code, scalable I/O

  datasource:
    url: jdbc:postgresql://localhost:5433/order_db
    username: order_user
    password: order_pass
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-DDL
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8085,http://tapride.local}
        allowed-methods: GET
        allowed-headers: "*"    
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

resilience4j:
  circuitbreaker:
    instances:
      rideLookup:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # A plain "ride not found" (404) must NOT count as a circuit-breaker
        # failure - otherwise enough legitimate 404 lookups could trip the
        # breaker for everyone. Only genuine infra/dependency trouble should count.
        ignore-exceptions:
          - com.tapride.order.domain.RideNotFoundException
  retry:
    instances:
      rideLookup:
        max-attempts: 3
        wait-duration: 200ms
        # Same reasoning - retrying a legitimate 404 three times is pointless.
        ignore-exceptions:
          - com.tapride.order.domain.RideNotFoundException

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
  structured:
    format:
      console: ecs   # Elastic Common Schema JSON logging, ties log lines to trace/correlation IDs

chaos:
  enabled: false   # toggled via the /chaos endpoint for live resilience demos
