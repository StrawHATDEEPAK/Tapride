server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: payment-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:3}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

  jackson:
    default-property-inclusion: non_null

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8085,http://tapride.local}
    
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

      cors:
        allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8085,http://tapride.local}
        allowed-methods: GET
        allowed-headers: "*"    
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

# Baseline chaos config - overridable at runtime via PUT /api/chaos (see ChaosSettings).
payment:
  mock:
    failure-rate: 0.15   # ~1 in 7 authorizations randomly fail, to exercise the saga's rollback path organically

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
  structured:
    format:
      console: ecs
