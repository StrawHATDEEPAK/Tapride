server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: notification-service

  threads:
    virtual:
      enabled: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8085,http://tapride.local}
        allowed-methods: GET
        allowed-headers: "*"    
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
  structured:
    format:
      console: ecs
