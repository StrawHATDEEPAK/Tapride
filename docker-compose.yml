networks:
  tapride-net:
    driver: bridge

volumes:
  order-pg-data:
  payment-pg-data:
  matching-pg-data:
  redis-data:
  kafka-data:

services:
  # ---------- Datastores ----------
  order-db:
    image: postgres:16-alpine
    container_name: tapride-order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    ports:
      - "5433:5432"
    volumes:
      - order-pg-data:/var/lib/postgresql/data
    networks: [tapride-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-db:
    image: postgres:16-alpine
    container_name: tapride-payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
    ports:
      - "5434:5432"
    volumes:
      - payment-pg-data:/var/lib/postgresql/data
    networks: [tapride-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  matching-db:
    image: postgres:16-alpine
    container_name: tapride-matching-db
    environment:
      POSTGRES_DB: matching_db
      POSTGRES_USER: matching_user
      POSTGRES_PASSWORD: matching_pass
    ports:
      - "5435:5432"
    volumes:
      - matching-pg-data:/var/lib/postgresql/data
    networks: [tapride-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matching_user -d matching_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tapride-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks: [tapride-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Messaging (Kafka in KRaft mode, no Zookeeper needed) ----------
  kafka:
    # Switched from bitnami/kafka: Bitnami restructured their public Docker Hub
    # catalog in Aug 2025 - most versioned tags (incl. 3.7) were moved to a
    # "bitnamilegacy" repo and are no longer pullable from bitnami/kafka directly.
    # apache/kafka is the official Apache-maintained image - no third-party
    # repackaging risk, and it's what Kafka's own docs now recommend for local dev.
    image: apache/kafka:latest
    container_name: tapride-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [tapride-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tapride-kafka-ui
    depends_on: [kafka]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tapride
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks: [tapride-net]

  # ---------- Application services (added as we build them) ----------
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: tapride-order-service
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    env_file:
      - ./order-service/.env
    networks: [tapride-net]

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: tapride-payment-service
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8080"
    env_file:
      - ./payment-service/.env
    networks: [tapride-net]

  matching-service:
    build:
      context: .
      dockerfile: matching-service/Dockerfile
    container_name: tapride-matching-service
    depends_on:
      matching-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8080"
    env_file:
      - ./matching-service/.env
    networks: [tapride-net]

  # notification-service 

  prometheus:
    image: prom/prometheus:latest
    container_name: tapride-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [tapride-net]

  grafana:
    image: grafana/grafana:latest
    container_name: tapride-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
    networks: [tapride-net]

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: tapride-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP - this is what our services already point to
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [tapride-net]

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: tapride-notification-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8084:8080"
    env_file:
      - ./notification-service/.env
    networks: [tapride-net]

  frontend:
    build:
      context: ./frontend
    container_name: tapride-frontend
    ports:
      - "8085:80"
    networks: [tapride-net]
