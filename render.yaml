# Render Blueprint - deploy all 5 services at once by connecting this repo
# in the Render dashboard ("New +" -> "Blueprint"). Render reads this file
# automatically.
#
# Service names below are deliberately explicit (not auto-generated) because
# frontend/js/config.production.example.js predicts each service's public URL
# from its name (Render's pattern: https://<name>.onrender.com) - if you
# rename a service here, update that file to match.
#
# Secrets (anything with `sync: false`) are NOT set here - Render will prompt
# you to fill them in via its dashboard on first deploy, and they're never
# committed to git. See infra/aiven/README.md for where each value comes from.

services:
  - type: web
    name: tapride-order-service
    runtime: docker
    dockerfilePath: ./order-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: SPRING_KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: SPRING_KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: SPRING_KAFKA_SASL_JAAS_CONFIG
        sync: false
      - key: SPRING_KAFKA_SSL_TRUSTSTORE_CERTIFICATES
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://tapride-frontend.onrender.com
      - key: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
        value: "0.0" # no Jaeger deployed publicly - see infra/aiven/README.md

  - type: web
    name: tapride-payment-service
    runtime: docker
    dockerfilePath: ./payment-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: SPRING_KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: SPRING_KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: SPRING_KAFKA_SASL_JAAS_CONFIG
        sync: false
      - key: SPRING_KAFKA_SSL_TRUSTSTORE_CERTIFICATES
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://tapride-frontend.onrender.com
      - key: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
        value: "0.0"

  - type: web
    name: tapride-matching-service
    runtime: docker
    dockerfilePath: ./matching-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        sync: false
      - key: SPRING_DATA_REDIS_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_SSL_ENABLED
        value: "true"
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: SPRING_KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: SPRING_KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: SPRING_KAFKA_SASL_JAAS_CONFIG
        sync: false
      - key: SPRING_KAFKA_SSL_TRUSTSTORE_CERTIFICATES
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://tapride-frontend.onrender.com
      - key: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
        value: "0.0"

  - type: web
    name: tapride-notification-service
    runtime: docker
    dockerfilePath: ./notification-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: SPRING_KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: SPRING_KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: SPRING_KAFKA_SASL_JAAS_CONFIG
        sync: false
      - key: SPRING_KAFKA_SSL_TRUSTSTORE_CERTIFICATES
        sync: false
      - key: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
        value: "0.0"

  - type: web
    name: tapride-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    healthCheckPath: /
